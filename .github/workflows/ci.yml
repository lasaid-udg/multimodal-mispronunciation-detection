name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Minimal permissions — read-only
permissions:
  contents: read

jobs:
  test:
    name: Tests & Lint (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check src/ tests/

      - name: Run tests
        # The raw CSV (data/raw/Nuevo_final_df.csv) is NOT present in CI.
        # Tests that require it use pytest.skip() automatically.
        # NO full training runs are executed — only unit/integration tests
        # with synthetic fixtures.
        run: python -m pytest tests/ -q --tb=short

      # ── What CI does NOT do ───────────────────────────────────────────────
      # - Does NOT run the 20 full-protocol scenarios (requires ~50-100 CPU·h)
      # - Does NOT download or publish the private CSV
      # - Does NOT require any secrets or tokens
      # - Does NOT push to any remote repository
