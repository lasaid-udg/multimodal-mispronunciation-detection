# ============================================================
# configs/paper.yaml — exact protocol used in the paper
# ============================================================
# Run a single scenario:
#   md-emg reproduce --channel ch2 --phoneme all --n-jobs 4
#
# Run all 20 scenarios:
#   scripts\run_all_20_repeated.bat        (Windows)
#   see docs/REPRODUCIBILITY.md           (Linux/macOS)
#
# Analyze results:
#   md-emg analyze <run_dir>
#   md-emg fdr runs/
# ============================================================

experiment:
  name: final
  seed: 2026
  # Seed scheme (frozen):
  #   repeat r seed: seed + (r - 1) * 10_000
  #   inner CV per outer fold f: repeat_seed + f
  #   estimator random state: same as inner seed

data:
  path: data/raw/Nuevo_final_df.csv
  subject_col: id_subject
  word_col: id_word
  target_col: Clase
  damage_marker: 888888
  # Class semantics:
  #   Clase = 1  →  pronunciation error  (positive class)
  #   Clase = 0  →  correct pronunciation (negative class)

scenario:
  # Override --channel and --phoneme on the CLI for each of the 20 scenarios.
  # Default values here are placeholders; the batch script sets them explicitly.
  phoneme: all        # all | t | d | theta | eth
  channel: ch2        # ch1 | ch2 | ch3 | ch4
  exclude_order_time: true   # order_CH* and time_CH* excluded from EMG predictors

cv:
  outer_folds: 5
  inner_folds: 3
  repeats: 10          # MANUSCRIPT VALUE — 5 outer folds × 10 repeats = 50 outer fits per model/modality
  shuffle: true
  # NOTE: configs/final.yaml keeps repeats: 1 as a safe default to avoid
  # accidental long runs. THIS file (paper.yaml) explicitly sets repeats: 10
  # to match the manuscript protocol. Do not reduce this value to save time
  # without marking results as non-scientific.

models:
  enabled:
    - svm
    - rf
    - dt
    - knn
    - gnb
    - mlp
    - lr

  svm:
    # SVM: scaled (StandardScaler applied in pipeline)
    # probability=False; continuous_score uses decision_function for ROC-AUC
    grid:
      - kernel:
          - linear
        C:
          - 0.1
          - 1.0
          - 10.0
      - kernel:
          - rbf
        C:
          - 0.1
          - 1.0
          - 10.0
        gamma:
          - scale

  rf:
    # RF: not scaled; class_weight tuned inside inner CV
    grid:
      n_estimators:
        - 300
      max_depth:
        - null
        - 10
        - 20
      min_samples_leaf:
        - 1
        - 2
      max_features:
        - sqrt

  dt:
    # DT: not scaled; class_weight tuned inside inner CV
    grid:
      max_depth:
        - null
        - 10
        - 20
        - 30
      min_samples_split:
        - 2
        - 5
        - 10
      min_samples_leaf:
        - 1
        - 2

  knn:
    # KNN: scaled; uniform/distance weighting tuned (no class_weight support)
    grid:
      n_neighbors:
        - 3
        - 5
        - 7
      weights:
        - uniform
        - distance
      p:
        - 1
        - 2

  gnb:
    # GNB: not scaled; no class_weight; no tunable weights
    grid:
      var_smoothing:
        - 1.0e-09
        - 1.0e-08
        - 1.0e-07

  mlp:
    # MLP: scaled; max_iter=3000; early stopping enabled
    # NOTE: early_stopping uses a held-out fraction of the TRAINING partition only.
    # It is an optimizer stopping mechanism, not an evaluation split.
    max_iter: 3000
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 20
    grid:
      hidden_layer_sizes:
        - [25]
        - [50]
        - [100]
      activation:
        - relu
        - tanh
        - logistic
      alpha:
        - 0.0001
        - 0.001
      learning_rate_init:
        - 0.001
        - 0.0005

  lr:
    # LR: scaled; max_iter=2000; solver=lbfgs; class_weight tuned inside inner CV
    max_iter: 2000
    grid:
      C:
        - 0.1
        - 1.0
        - 10.0

balance:
  class_weight: tune      # None vs "balanced" searched inside inner CV for svm/rf/dt/lr
  options:
    - null
    - balanced

selection:
  scoring: balanced_accuracy

# ─── Statistical analysis (applied post-hoc via `md-emg analyze`) ───
analysis:
  bootstrap: 2000          # participant-cluster resamples
  permutations: 2000       # paired participant-level modality permutations
  seed: 2026
  # FDR families (applied via `md-emg fdr`):
  #   general:        28 comparisons  (4 channels × 7 models)
  #   phoneme_channel: 112 comparisons (4 phonemes × 4 channels × 7 models)
  #   alpha: 0.05

compute:
  n_jobs: 4          # override with --n-jobs on CLI
  save_models: true  # required for permutation importance; use --no-save-models to skip
  verbose: true

output:
  root: runs
  save_inner_cv: true
  parquet_compression: snappy
